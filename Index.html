
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPBL Assets</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101722;
      color: #f1f5f9;
    }

    main {
      width: min(500px, 85vw);
      padding: 40px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #192332;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0.03em;
    }

    p {
      color: #aebdd0;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #163b30;
      color: #86efac;
      font-size: 13px;
    }

    footer {
      margin-top: 32px;
      color: #718096;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>JPBL Assets</h1>
    <p>
      Japan Professional Baseball League<br>
      Static Asset Repository
    </p>

    <p>
      JPBL関連サービスで使用する画像・ロゴ・
      その他の静的アセットを配信するためのサイトです。
    </p>

    <div class="status">● GitHub Pages is working</div>

    <footer>JPBL Asset Hosting Service</footer>
  </main>
</body>
</html>
